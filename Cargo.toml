[package]
name = "spatie-robots-txt"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Brent Roose <brent@spatie.be>"]
description = "Parse robots.txt, robots meta tags and X-Robots-Tag headers"
license = "MIT"
repository = "https://github.com/spatie/robots-txt-rust"
documentation = "https://docs.rs/spatie-robots-txt"
readme = "README.md"
keywords = ["spatie", "robots", "robots-txt", "crawler", "seo"]
categories = ["web-programming", "parser-implementations"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "2"
url = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
